<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancer Registry - Cancer Type</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="type">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./type.html">Cancer Registry</a>
        <nav class="nav">
          <a class="nav__link nav__link--active" href="./type.html"
            >Cancer Type</a
          >
          <a class="nav__link" href="./patients.html">Patients</a>

      <section class="stack">

      </section>

    <script src="./app.js"></script>
